## 10. API Design

### 10.1 REST (examples)

| Method | Endpoint | Purpose |
|---|---|---|
| POST | `/auth/register` · `/auth/login` · `/auth/refresh` · `/auth/logout` | Authentication |
| GET/POST | `/workspaces` | List / create workspaces |
| PATCH/DELETE | `/workspaces/:id` | Rename / delete |
| POST | `/workspaces/:id/invites` | Create invite |
| POST | `/invites/:token/accept` | Join workspace |
| PATCH/DELETE | `/workspaces/:id/members/:userId` | Change role / remove |
| GET | `/workspaces/:id/files` | File tree |
| POST/PATCH/DELETE | `/workspaces/:id/files` | Create / rename / delete |
| GET | `/workspaces/:id/chat?before=` | Paginated chat history |

### 10.2 WebSocket Channels

| Channel | Events |
|---|---|
| `/collab/:fileId` | Yjs sync step 1/2, updates, awareness |
| `/workspace/:id` | File-tree changes, member join/leave, chat messages, presence |
| `/terminal/:workspaceId` | Input, output, resize, session lifecycle |

All connections authenticate with a short-lived token on connect and re-check permissions on role changes (a demoted user is immediately downgraded or disconnected).

