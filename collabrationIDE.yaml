## 8. Security

| Threat | Mitigation |
|---|---|
| Account takeover | Argon2id password hashing, rate-limited login, optional 2FA, token rotation |
| Unauthorized file access | Server-side role checks on every request and WebSocket message |
| WebSocket abuse | Auth on connect, per-message validation, size and rate limits, origin checks |
| Malicious code execution | Container isolation (Section 7), resource limits, egress control |
| XSS in chat/preview | Output encoding, strict CSP, sandboxed preview origins |
| CSRF | SameSite cookies, CSRF tokens for cookie-authenticated routes |
| Invite-link leakage | Expiring, single-use or limited-use, revocable links |
| Secrets in workspaces | Encrypted workspace secrets store; never logged or shown to Viewers |
| Data leakage between tenants | Tenant-scoped queries, separate volumes/containers, regular audits |

