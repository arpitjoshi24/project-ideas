## 3. Functional Requirements

Priority: **P0** = MVP, **P1** = after MVP, **P2** = future.

### 3.1 Authentication (P0)

- Register, login, logout, password reset, profile management.
- View the list of workspaces the user belongs to.
- Email + password with short-lived JWT access tokens and rotating refresh tokens (httpOnly, secure cookie).
- P1: OAuth login (GitHub, Google).

### 3.2 Workspaces (P0)

A workspace is a collaborative environment containing members, project files, a terminal, a preview, chat, and Git state.

- Create, rename, delete workspace.
- Invite members (by link or email), remove members, change roles, leave workspace.
- Invite links are expiring and revocable.

### 3.3 File System (P0)

- Create, rename, move, delete files and folders.
- File explorer tree with live updates when others change the structure.
- Upload and download project as a zip (P1).

### 3.4 Real-Time Code Collaboration (P0 — core feature)

- Simultaneous editing of the same file by multiple users.
- Live remote cursors and selections with user names and colors.
- Automatic conflict resolution (no overwritten edits).
- Reconnection and offline-edit merge.
- Per-user undo/redo (undo only your own changes).

### 3.5 Presence (P0)

- Online / idle / offline status.
- Current file and cursor position.
- Presence is ephemeral and never persisted to the main database.

### 3.6 Editor (P0)

Built on Monaco (recommended) or CodeMirror 6: syntax highlighting, tabs, search/replace, keyboard shortcuts, themes, minimap, and error highlighting. Language-server-powered autocomplete is P1.

### 3.7 Roles and Permissions (P0)

| Capability | Owner | Admin | Developer | Viewer |
|---|:-:|:-:|:-:|:-:|
| View code, chat, preview | ✅ | ✅ | ✅ | ✅ |
| Edit code | ✅ | ✅ | ✅ | ❌ |
| Run project / use terminal | ✅ | ✅ | ✅ | ❌ |
| Manage members | ✅ | ✅ | ❌ | ❌ |
| Manage project settings | ✅ | ✅ | ❌ | ❌ |
| Delete workspace / transfer ownership | ✅ | ❌ | ❌ | ❌ |

Permissions are enforced **on the server** for every REST call and WebSocket message, never only in the UI.

### 3.8 Chat (P1)

Workspace chat with messages, @mentions, file references (click to open), code snippets, timestamps, and online status. Persisted in PostgreSQL.

### 3.9 Shared Terminal and Execution (P1)

- Per-workspace isolated container (see Section 7).
- Shared terminal: all developers see the same session; write access limited to Developer+ roles.
- Run/stop controls, resource usage, and idle shutdown.

### 3.10 Live Preview (P1)

Temporary, authenticated preview URL that proxies to the dev server inside the workspace container (see Section 7.3).

### 3.11 Code Awareness (P1)

Make collaboration visible in the editor: remote cursors, selection highlights, "Rahul is editing this line" indicators, recently modified line markers, and per-file activity badges in the explorer.

### 3.12 Git Integration (P1 → P2)

- P1: status, diff, commit, branch, checkout.
- P2: push/pull, GitHub import via OAuth, shared conflict resolution.

