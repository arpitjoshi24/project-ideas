## 6. System Architecture

```text
                   ┌─────────────────────┐
                   │      Frontend       │
                   │ Next.js / React     │
                   │ Monaco + Yjs        │
                   └──────────┬──────────┘
                              │ HTTPS / WSS
              ┌───────────────┴────────────────┐
              ▼                                ▼
      ┌──────────────┐                 ┌───────────────┐
      │  API Server  │                 │ Collaboration │
      │ REST · Auth  │                 │ Server (WS)   │
      └──────┬───────┘                 └──────┬────────┘
             │                                │
   ┌─────────┼──────────┐              ┌──────┴───────┐
   ▼         ▼          ▼              ▼              ▼
PostgreSQL  Redis   Object/Volume   Doc state      Presence
                    storage         (Yjs)
             │
             ▼
     Execution Service ──► Isolated containers ──► Reverse proxy ──► Preview URL
```

**Components**

| Component | Responsibility |
|---|---|
| Frontend | UI, Monaco editor, Yjs client, state (Zustand) |
| API Server | Auth, workspaces, members, files metadata, chat history, invites |
| Collaboration Server | WebSocket rooms, Yjs sync, awareness, permission checks |
| Execution Service | Container lifecycle, terminal streams, resource limits |
| Reverse Proxy | Routes preview traffic to the right container, enforces auth |
| PostgreSQL | Relational metadata |
| Redis | Presence, Pub/Sub, rate limiting, ephemeral state |

