# 11. Shared Terminal

Users should be able to execute project commands.

Examples:

```bash
npm install
npm run dev
npm test
git status
```

However, terminal execution must happen in an **isolated environment**.

Never execute arbitrary user commands directly on the main application server.

Recommended architecture:

```text
User
 │
 ▼
API Server
 │
 ▼
Job / Execution Service
 │
 ▼
Isolated Container
 │
 ├── CPU limit
 ├── Memory limit
 ├── Network policy
 └── Time limit
```

Each workspace can receive its own isolated development environment.

