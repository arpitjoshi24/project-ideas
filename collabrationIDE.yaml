# 6. Real-Time Code Collaboration

This is the **core feature** of the project.

Multiple users should be able to edit the same file simultaneously.

Example:

```text
                    App.jsx

Developer A
       │
       ├── types: "const user = ..."
       │
       ▼
┌───────────────────────────────┐
│        Collaboration          │
│           Server              │
└───────────────┬───────────────┘
                │
       synchronized state
                │
        ┌───────┴────────┐
        ▼                ▼
 Developer B        Developer C
```

### Requirements

The system should support:

* Real-time text changes
* Cursor positions
* Selection ranges
* User presence
* File opening status
* Multiple simultaneous editors
* Conflict resolution
* Reconnection
* Offline/reconnect synchronization

