## 5. Real-Time Collaboration Design

### 5.1 Conflict Resolution: OT vs CRDT

Example conflict: both users change `const name = "Arpit";` at the same moment, one to `"Rahul"` and the other to `"Aman"`. The system must merge deterministically without silently discarding either edit.

| | Operational Transformation | CRDT |
|---|---|---|
| Server required | Central server transforms ops | Peer-to-peer capable; server optional |
| Offline support | Harder | Natural |
| Implementation complexity | High (transform functions are subtle) | Library-dependent, moderate |
| Memory overhead | Low | Higher (tombstones; mitigated by GC) |
| Ecosystem | ShareDB | **Yjs**, Automerge |

**Decision:** use **Yjs** (CRDT) with the `y-monaco` binding and `y-protocols` awareness for cursors and presence. It provides offline merge, reconnection, and per-user undo out of the box. Implementing a custom CRDT/OT engine is kept as a stretch learning goal behind an interface so the engine can be swapped.

### 5.2 Synchronization Flow

```text
Client (Monaco + Y.Doc)
   │  1. local edit applied instantly
   │  2. Yjs update (binary) sent over WebSocket
   ▼
Collaboration Server (per-document room)
   │  3. validate token + role (Viewer updates rejected)
   │  4. apply to server-side Y.Doc
   │  5. broadcast update to other clients
   │  6. debounce-persist snapshot + incremental updates
   ▼
Other clients apply update → editor updates
```

### 5.3 Reconnection

1. Client keeps its local `Y.Doc` while disconnected and continues to accept edits.
2. On reconnect, client sends its **state vector**.
3. Server replies with the missing updates; client sends its own missing updates.
4. Both converge automatically. The UI shows a "Reconnecting… / Synced" indicator.

### 5.4 Presence and Awareness

Presence is transmitted via the Yjs awareness protocol and held in memory/Redis with a TTL, not in PostgreSQL.

```yaml
presence:
  user: { id, name, avatar, color }
  status: online | idle | offline
  current_file: src/App.jsx
  cursor: { line, column }
  selection: { start, end }
  last_activity: 2026-01-01T10:00:00Z
```

### 5.5 Persistence of Document State

- Live state: Yjs document in the collaboration server memory.
- Durable state: incremental updates in the database, periodically compacted into snapshots.
- Source of truth for the project filesystem: a workspace volume / object storage; documents are flushed to the filesystem so the terminal and Git see current code.
- Version history and playback (P2) can reuse the stored update log.

### 5.6 Scaling the Collaboration Layer

- A document room is owned by **one** collaboration server instance at a time (sticky routing by `workspace_id`/`file_id`).
- Redis Pub/Sub distributes messages when clients of one room are connected to different nodes, or rooms are routed via consistent hashing.
- Horizontal scale by adding collaboration nodes; PostgreSQL and Redis are shared.
- Backpressure: per-connection rate limits and maximum message size.

