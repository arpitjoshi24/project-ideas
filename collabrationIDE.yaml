## 1. Overview

### 1.1 Summary

A browser-based IDE where two or more developers open the same project and **edit, run, and discuss the same codebase simultaneously**. Collaboration is built into the core of the product rather than layered on top of an editor.

### 1.2 Vision

A **shared development environment**, not merely a code editor with a multiplayer cursor: shared files, shared terminal, shared preview, shared context.

```text
                 Collaborative Workspace
                         │
          ┌──────────────┼──────────────┐
          │              │              │
     Developer A    Developer B    Developer C
     (server.js)     (auth.js)      (UI.jsx)
          │              │              │
          └──────────────┼──────────────┘
                         ▼
                 Shared Project State
                         │
              ┌──────────┼──────────┐
              ▼          ▼          ▼
          Terminal    Preview      Git
```

### 1.3 Problem Statement

Collaboration today is spread across many tools: an editor, GitHub, Slack/Discord, Zoom/Meet, and docs. Pair programming usually means one person types while the other watches a shared screen and waits. The goal is to make the coding environment itself collaborative so that nobody has to wait.

### 1.4 Goals and Non-Goals

**Goals**
- Real-time, conflict-free co-editing of project files.
- Visible presence: who is online, which file, which cursor and selection.
- Safe, isolated code execution with a shared terminal and live preview.
- Workspace roles and permissions.
- Built-in chat and (later) Git integration.

**Non-goals for the MVP**
- Full VS Code extension compatibility.
- Voice/video calling.
- Collaborative debugging.
- Native desktop app.
- Support for every language/runtime (start with Node.js projects).

