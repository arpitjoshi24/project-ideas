## 12. Engineering Challenges

| # | Challenge | Approach |
|---|---|---|
| 1 | Concurrent edits without data loss | Yjs CRDT, property-based tests with random concurrent edits |
| 2 | Latency of 100–300 ms | Optimistic local apply, binary updates, batching, regional deployment (later) |
| 3 | Reconnection after network loss | State-vector sync, local buffering, UI indicators |
| 4 | Scaling rooms and users | Sticky room routing, Redis Pub/Sub, load tests |
| 5 | Safe execution of arbitrary code | Hardened containers/microVMs, egress control, quotas |
| 6 | Keeping editor docs and filesystem consistent | Debounced flush, file-watcher in the container, conflict policy for external changes (e.g. `git checkout`) |
| 7 | Memory growth of CRDT history | Garbage collection, snapshot compaction |

