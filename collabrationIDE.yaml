## 7. Execution Environment

> **Never** run user commands on the main application servers.

### 7.1 Architecture

```text
User → API Server → Execution Service → Isolated Container
                                         ├── CPU limit
                                         ├── Memory limit
                                         ├── Process (PID) limit
                                         ├── Disk quota
                                         ├── Network policy
                                         └── Time limit
```

### 7.2 Isolation Requirements

- One container (or microVM) per workspace; never shared between workspaces.
- Run as a non-root user, read-only root filesystem, writable workspace volume only.
- Drop all Linux capabilities, apply seccomp/AppArmor profiles, no privileged mode, no Docker socket access.
- Default-deny egress; allow-list package registries (npm, PyPI) through a proxy.
- Hard limits on CPU, memory, PIDs, disk, and wall-clock time; auto-stop on idle.
- For stronger isolation in production, evaluate gVisor, Firecracker, or Kata Containers instead of plain Docker.
- Abuse protection: rate limits, crypto-mining detection, per-user quotas.

### 7.3 Live Preview

```text
Dev server in container → Reverse proxy → https://<workspace-id>.preview.example.com
```

- Preview URLs are unguessable and require authentication by default (public sharing is an explicit opt-in).
- Each preview on its own subdomain to isolate cookies and origins.
- WebSocket proxying supported for hot module reload.

