## 13. Roadmap

### Phase 1 — Basic IDE (MVP core)
Login → workspace → file explorer → Monaco editor → save files.
**Exit criteria:** a single user can create a workspace, manage files, and edit persistently.

### Phase 2 — Real-time collaboration
WebSocket server → Yjs shared documents → multiple users → cursor presence.
**Exit criteria:** two browsers edit one file concurrently and converge; reconnect works.

### Phase 3 — Workspace management
Members, invites, roles, permission enforcement, chat.
**Exit criteria:** role matrix in Section 3.7 verified by automated tests.

### Phase 4 — Execution
Container service → run commands → shared terminal → preview URL.
**Exit criteria:** a sample React/Node project runs and previews safely under resource limits.

### Phase 5 — Git
Status, diff, commit, branch, push/pull, GitHub import.

### Phase 6 — Advanced features
See Section 15.

---

## 14. Testing Strategy

| Type | Scope |
|---|---|
| Unit | Permission logic, API handlers, utilities |
| Integration | REST + DB, WebSocket auth and room join, Redis presence |
| Convergence / fuzz | Random concurrent edits from N simulated clients must converge to identical text |
| Network chaos | Packet delay, loss, disconnect/reconnect during edits |
| Load | Many rooms × many clients; measure p95 latency and memory |
| Security | Container escape attempts, permission bypass, fuzzing WebSocket messages, dependency scanning |
| End-to-end | Playwright with two simultaneous browser contexts |

