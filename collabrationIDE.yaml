# 26. Unique Extensions

### Collaborative Debugger

Two developers can debug the same application simultaneously.

```text
Developer A
     │
     ▼
Breakpoint
     │
     ▼
Shared Debug Session
     │
     ├── Variables
     ├── Call Stack
     └── Execution State
     │
     ▼
Developer B
```

### Code Playback

Record document operations and replay how the code evolved.

```text
10:00 ─ Initial code
10:05 ─ Function added
10:12 ─ Bug introduced
10:18 ─ Bug fixed
10:25 ─ Feature completed
```

### Collaborative AI Mentor

AI can understand the shared workspace and answer:

> "Why is this API returning 401?"

The AI sees the relevant code and project context rather than only a pasted snippet.

---

# 27. Success Criteria

The MVP is successful when:

* Two users can enter the same workspace.
* Both can open the same file.
* Both can edit simultaneously.
* Changes appear in real time.
* Concurrent edits don't unnecessarily overwrite each other.
* User cursors/presence are visible.
* Users can create and manage files.
* Users can run a supported project safely.
* Users can see the application preview.

