# 23. Important Engineering Challenges

This project is primarily interesting because of its engineering challenges.

### Challenge 1 — Concurrent editing

How do multiple users modify one document without losing changes?

### Challenge 2 — Network latency

What happens when:

```text
User A → edit
        ↓
     Network
        ↓
     Server
        ↓
     User B
```

takes 100–300 ms?

### Challenge 3 — Reconnection

A developer loses internet for 10 seconds.

When they reconnect:

```text
Local state
     +
Server state
     ↓
Synchronization
```

must occur safely.

### Challenge 4 — Scaling

If:

```text
Workspace A → 5 users
Workspace B → 20 users
Workspace C → 100 users
```

the collaboration layer must handle many simultaneous sessions.

### Challenge 5 — Secure code execution

Running arbitrary code inside a cloud service is dangerous.

The execution layer needs strong isolation.

