## 4. Non-Functional Requirements

| Area | Target (initial) |
|---|---|
| **Latency** | Local edit applied instantly; remote edit visible < 150 ms on the same region, < 300 ms globally |
| **Capacity** | MVP: 10 concurrent editors per workspace; design for 100 viewers |
| **Availability** | 99.5% for MVP; graceful degradation if execution service is down (editing still works) |
| **Durability** | No acknowledged edit is lost; document snapshots persisted at least every 30 s and on last-user-leave |
| **Security** | OWASP Top 10 mitigations, isolated execution, least-privilege access (see Section 8) |
| **Accessibility** | Keyboard-navigable UI, WCAG 2.1 AA colors for presence indicators |
| **Browser support** | Latest two versions of Chrome, Edge, Firefox, Safari |
| **Observability** | Structured logs, metrics, tracing, error reporting |

