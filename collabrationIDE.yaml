# 7. Conflict Resolution

This is one of the most important technical problems.

Suppose:

```text
Initial:

const name = "Arpit";
```

Developer A changes:

```text
const name = "Rahul";
```

At almost the same time Developer B changes:

```text
const name = "Aman";
```

The system must prevent one user's changes from simply overwriting another user's changes.

Possible technologies:

### Option A — Operational Transformation (OT)

Transform concurrent operations before applying them.

```text
Operation A
     │
     ▼
Transform
     ▲
     │
Operation B
```

### Option B — CRDT

Represent the document as a conflict-free replicated data structure.

The project can initially use an existing CRDT implementation and later explore implementing parts of synchronization independently.

