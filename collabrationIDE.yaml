## 15. Future Features

**Collaboration:** voice/video calls, screen sharing, pair-programming (follow mode), interview mode, classroom mode, hackathon workspaces, temporary public workspaces.

**Intelligence:** collaborative AI mentor that sees workspace context (e.g. "Why is this API returning 401?"), AI code review.

**Developer experience:** collaborative debugger with synchronized breakpoints, shared variables and call stack; session recording and code playback from stored operations; project activity timeline; collaborative Git conflict resolution.

**Platform:** plugin system, VS Code extension, desktop app.

```text
Code playback example
10:00 ─ Initial code
10:05 ─ Function added
10:12 ─ Bug introduced
10:18 ─ Bug fixed
10:25 ─ Feature completed
```

---

## 16. Success Criteria

The MVP succeeds when:

- [ ] Two users can join the same workspace and open the same file.
- [ ] Both can edit simultaneously and see changes in real time.
- [ ] Concurrent edits merge without loss; reconnecting clients converge.
- [ ] Cursors, selections, and presence are visible.
- [ ] Users can create and manage files and folders.
- [ ] Roles and permissions are enforced on the server.
- [ ] A supported project runs safely in an isolated container.
- [ ] The application preview is visible to workspace members.

