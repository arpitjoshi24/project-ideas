## 9. Data Model

### 9.1 Relational Schema (PostgreSQL)

```sql
CREATE TABLE users (
  id            UUID PRIMARY KEY,
  name          TEXT NOT NULL,
  email         CITEXT UNIQUE NOT NULL,
  password_hash TEXT NOT NULL,
  avatar_url    TEXT,
  created_at    TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE TABLE workspaces (
  id          UUID PRIMARY KEY,
  name        TEXT NOT NULL,
  owner_id    UUID NOT NULL REFERENCES users(id),
  created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
  deleted_at  TIMESTAMPTZ
);

CREATE TYPE member_role AS ENUM ('owner', 'admin', 'developer', 'viewer');

CREATE TABLE workspace_members (
  workspace_id UUID REFERENCES workspaces(id) ON DELETE CASCADE,
  user_id      UUID REFERENCES users(id) ON DELETE CASCADE,
  role         member_role NOT NULL,
  joined_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
  PRIMARY KEY (workspace_id, user_id)
);

CREATE TABLE workspace_invites (
  id           UUID PRIMARY KEY,
  workspace_id UUID NOT NULL REFERENCES workspaces(id) ON DELETE CASCADE,
  token_hash   TEXT NOT NULL,
  role         member_role NOT NULL,
  expires_at   TIMESTAMPTZ NOT NULL,
  max_uses     INT,
  used_count   INT NOT NULL DEFAULT 0,
  revoked_at   TIMESTAMPTZ
);

CREATE TABLE projects (
  id             UUID PRIMARY KEY,
  workspace_id   UUID NOT NULL REFERENCES workspaces(id) ON DELETE CASCADE,
  name           TEXT NOT NULL,
  repository_url TEXT,
  created_at     TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE TABLE files (
  id         UUID PRIMARY KEY,
  project_id UUID NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
  path       TEXT NOT NULL,
  language   TEXT,
  created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
  updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
  UNIQUE (project_id, path)
);

CREATE TABLE document_snapshots (
  file_id    UUID REFERENCES files(id) ON DELETE CASCADE,
  version    BIGINT NOT NULL,
  state      BYTEA NOT NULL,          -- encoded Yjs state
  created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
  PRIMARY KEY (file_id, version)
);

CREATE TABLE chat_messages (
  id           UUID PRIMARY KEY,
  workspace_id UUID NOT NULL REFERENCES workspaces(id) ON DELETE CASCADE,
  user_id      UUID NOT NULL REFERENCES users(id),
  message      TEXT NOT NULL,
  created_at   TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE TABLE sessions (
  id              UUID PRIMARY KEY,
  workspace_id    UUID NOT NULL REFERENCES workspaces(id),
  user_id         UUID NOT NULL REFERENCES users(id),
  connected_at    TIMESTAMPTZ NOT NULL,
  disconnected_at TIMESTAMPTZ
);

CREATE INDEX ON chat_messages (workspace_id, created_at DESC);
CREATE INDEX ON workspace_members (user_id);
```

### 9.2 Ephemeral State (Redis)

| Key | Contents | TTL |
|---|---|---|
| `presence:{workspace}:{user}` | Status, current file, cursor | ~30 s, refreshed by heartbeat |
| `room:{file}:node` | Collaboration node owning the room | While room active |
| `ratelimit:{user}:{route}` | Request counters | Window length |

