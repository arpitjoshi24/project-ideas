## 17. Risks and Open Questions

| Risk / question | Impact | Mitigation / next step |
|---|---|---|
| Container escape or abuse of free compute | Critical | Hardened runtime, quotas, egress control; consider limiting terminal at first |
| Execution costs scale with users | High | Idle shutdown, per-user quotas, ephemeral workspaces |
| Scope too large for one developer | High | Strict phase gates; ship Phase 2 as a usable product first |
| CRDT memory growth on large files | Medium | Size limits, GC, snapshot compaction |
| Monaco binding edge cases | Medium | Fuzz tests; keep CodeMirror as fallback |
| Should the terminal be single shared session or per-user? | — | Decide in Phase 4 design |
| Hosting model (self-hosted vs SaaS) | — | Decide before Phase 4 |
| Licensing/pricing model (if productized) | — | Out of scope for MVP |

